<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoliaPerms Editor Panel</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #0a0616 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.07);
            --primary: #8a2be2;
            --primary-glow: rgba(138, 43, 226, 0.4);
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.4);
            --text: #e0dcf5;
            --text-muted: #9b95c0;
            --danger: #ff4757;
            --success: #2ed573;
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Layout header */
        header {
            background: rgba(15, 12, 32, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(45deg, #a855f7, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-symbol {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            -webkit-text-fill-color: initial;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .save-btn {
            background: linear-gradient(135deg, var(--primary), #6b21a8);
            border: none;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(138, 43, 226, 0.6);
        }

        .save-btn:active {
            transform: translateY(0);
        }

        /* Container Main */
        main {
            flex: 1;
            padding: 2.5rem;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* Panel Glass Styling */
        .panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.75rem;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            height: 75vh;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .panel-title.groups::before {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .search-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-bar:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Content lists */
        .list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-right: 0.5rem;
        }

        .list-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .list-item:hover {
            background: var(--glass-hover);
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .item-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 0.75rem;
        }

        .meta-tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
        }

        .action-btn.delete:hover {
            color: var(--danger);
            background: rgba(255, 71, 87, 0.1);
        }

        .create-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--glass-border);
            color: var(--text);
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .create-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Detail Modal Editor */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 6, 22, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #141026;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            width: 650px;
            max-width: 90%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.5rem;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-body {
            padding: 2rem;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Tags for groups/permissions */
        .tags-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            min-height: 40px;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
        }

        .tag {
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.4);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .tag:hover {
            background: rgba(138, 43, 226, 0.35);
        }

        .tag-remove {
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
        }

        .tag-remove:hover {
            color: var(--danger);
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            position: relative;
        }

        .input-group input {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .add-tag-btn {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-tag-btn:hover {
            background: #9b4cfb;
        }

        /* Autocomplete dropdown */
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #17132d;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            margin-top: 4px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
        }

        .autocomplete-dropdown.active {
            display: block;
        }

        .autocomplete-item {
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .autocomplete-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--accent);
        }

        /* Modal footer */
        .modal-footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .cancel-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* Loading / Toast notification styling */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(20, 16, 38, 0.9);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateY(150%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .toast.active {
            transform: translateY(0);
        }

        .toast-icon {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .toast.success {
            border-left-color: var(--success);
        }
        
        .toast.error {
            border-left-color: var(--danger);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-symbol">FP</div>
            FoliaPerms Editor Panel
        </div>
        <button class="save-btn" id="global-save-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Save Changes
        </button>
    </header>

    <main>
        <!-- Groups Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title groups">Groups</h2>
            </div>
            <input type="text" class="search-bar" id="search-groups" placeholder="Search groups...">
            <div class="list-container" id="groups-list">
                <!-- Javascript populated -->
            </div>
            <button class="create-btn" onclick="openCreateGroupModal()">
                + Create Group
            </button>
        </div>

        <!-- Players Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title players">Players</h2>
            </div>
            <input type="text" class="search-bar" id="search-players" placeholder="Search players...">
            <div class="list-container" id="players-list">
                <!-- Javascript populated -->
            </div>
            <button class="create-btn" onclick="openCreatePlayerModal()">
                + Cache Player Profile
            </button>
        </div>
    </main>

    <!-- Overlay & Modal Editor -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Edit Profile</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Dynamic form fields -->
                <div class="form-section" id="groups-field-section">
                    <span class="form-label" id="modal-field-label">Groups</span>
                    <div class="tags-wrapper" id="modal-groups-tags">
                        <!-- Tags listed -->
                    </div>
                    <div class="input-group">
                        <input type="text" id="group-add-input" placeholder="Type a group to add..." oninput="handleGroupInput(this)">
                        <button class="add-tag-btn" onclick="addGroupTag()">Add</button>
                        <div class="autocomplete-dropdown" id="group-autocomplete"></div>
                    </div>
                </div>

                <div class="form-section">
                    <span class="form-label">Permission Nodes</span>
                    <div class="tags-wrapper" id="modal-perms-tags">
                        <!-- Tags listed -->
                    </div>
                    <div class="input-group">
                        <input type="text" id="perm-add-input" placeholder="Type a permission to add..." oninput="handlePermInput(this)">
                        <button class="add-tag-btn" onclick="addPermTag()">Add</button>
                        <div class="autocomplete-dropdown" id="perm-autocomplete"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Toast message -->
    <div class="toast" id="toast">
        <span class="toast-icon" id="toast-icon">✔</span>
        <span id="toast-msg">Settings saved!</span>
    </div>

    <script>
        // Data states
        let state = {
            users: {},
            groups: {},
            registeredPermissions: []
        };

        let currentEditor = {
            type: null, // 'user' or 'group'
            id: null    // UUID or Group name
        };

        // Extracted from browser URL query
        const token = new URLSearchParams(window.location.search).get('token') || '';

        // Toast helper
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const label = document.getElementById('toast-msg');

            toast.className = 'toast ' + type;
            icon.innerText = type === 'success' ? '✔' : '✖';
            label.innerText = msg;

            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Fetch current states
        async function loadState() {
            try {
                const res = await fetch(`/api/data?token=${token}`);
                if (!res.ok) throw new Error(res.statusText);
                state = await res.json();
                renderLists();
            } catch (err) {
                console.error("Failed to load permissions:", err);
                showToast("Failed to connect to FoliaPerms server. Session may be expired.", "error");
            }
        }

        // Save states back to Minecraft server
        async function saveState() {
            try {
                const res = await fetch(`/api/save?token=${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        users: state.users,
                        groups: state.groups
                    })
                });
                
                if (res.ok) {
                    showToast("Successfully synchronized permission changes to server!", "success");
                } else {
                    const err = await res.json();
                    showToast(`Error: ${err.message || 'Failed to save changes.'}`, "error");
                }
            } catch (err) {
                console.error(err);
                showToast("Connection to server failed.", "error");
            }
        }

        // Render visual listing components
        function renderLists() {
            // Render groups list
            const groupsContainer = document.getElementById('groups-list');
            const searchGroups = document.getElementById('search-groups').value.toLowerCase();
            groupsContainer.innerHTML = '';
            
            Object.keys(state.groups).forEach(name => {
                if (name.includes(searchGroups)) {
                    const g = state.groups[name];
                    const permsCount = g.permissions ? g.permissions.length : 0;
                    const membersCount = g.members ? g.members.length : 0;
                    
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.onclick = () => openGroupEditor(name);
                    div.innerHTML = `
                        <div class="item-info">
                            <span class="item-name">${name}</span>
                            <div class="item-meta">
                                <span class="meta-tag">&bull; ${permsCount} permissions</span>
                                <span class="meta-tag">&bull; ${membersCount} members</span>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn delete" onclick="deleteGroup('${name}', event)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                    `;
                    groupsContainer.appendChild(div);
                }
            });

            // Render players list
            const playersContainer = document.getElementById('players-list');
            const searchPlayers = document.getElementById('search-players').value.toLowerCase();
            playersContainer.innerHTML = '';

            Object.keys(state.users).forEach(uuid => {
                if (uuid.includes(searchPlayers)) {
                    const u = state.users[uuid];
                    const permsCount = u.permissions ? u.permissions.length : 0;
                    const groupsCount = u.groups ? u.groups.length : 0;

                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.onclick = () => openUserEditor(uuid);
                    div.innerHTML = `
                        <div class="item-info">
                            <span class="item-name" style="font-family: monospace; font-size: 0.9rem;">${uuid}</span>
                            <div class="item-meta">
                                <span class="meta-tag">&bull; ${permsCount} permissions</span>
                                <span class="meta-tag">&bull; ${groupsCount} groups</span>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn delete" onclick="deletePlayer('${uuid}', event)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                    `;
                    playersContainer.appendChild(div);
                }
            });
        }

        // Delete group
        function deleteGroup(name, event) {
            event.stopPropagation();
            if (confirm(`Are you sure you want to delete group '${name}'?`)) {
                delete state.groups[name];
                // remove group from users
                Object.values(state.users).forEach(u => {
                    if (u.groups) u.groups = u.groups.filter(g => g !== name);
                });
                renderLists();
            }
        }

        // Delete player
        function deletePlayer(uuid, event) {
            event.stopPropagation();
            if (confirm(`Are you sure you want to delete player '${uuid}'?`)) {
                delete state.users[uuid];
                // remove player from group members
                Object.values(state.groups).forEach(g => {
                    if (g.members) g.members = g.members.filter(m => m !== uuid);
                });
                renderLists();
            }
        }

        // Modal triggers
        function openGroupEditor(name) {
            currentEditor.type = 'group';
            currentEditor.id = name;
            
            document.getElementById('modal-title').innerText = `Group Editor \u2BBF ${name}`;
            document.getElementById('groups-field-section').style.display = 'flex';
            document.getElementById('modal-field-label').innerText = 'Members (UUIDs)';
            document.getElementById('group-add-input').placeholder = 'Type member UUID to add...';
            
            refreshModalTags();
            document.getElementById('modal-overlay').classList.add('active');
        }

        function openUserEditor(uuid) {
            currentEditor.type = 'user';
            currentEditor.id = uuid;

            document.getElementById('modal-title').innerText = `Player Editor \u2BBF ${uuid}`;
            document.getElementById('groups-field-section').style.display = 'flex';
            document.getElementById('modal-field-label').innerText = 'Assigned Groups';
            document.getElementById('group-add-input').placeholder = 'Type group to assign...';

            refreshModalTags();
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            // Clear autocomplete fields
            document.getElementById('group-autocomplete').classList.remove('active');
            document.getElementById('perm-autocomplete').classList.remove('active');
            document.getElementById('group-add-input').value = '';
            document.getElementById('perm-add-input').value = '';
        }

        function refreshModalTags() {
            const grpsWrapper = document.getElementById('modal-groups-tags');
            const permsWrapper = document.getElementById('modal-perms-tags');
            grpsWrapper.innerHTML = '';
            permsWrapper.innerHTML = '';

            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                
                // Render members
                if (g.members) {
                    g.members.forEach(member => {
                        const tag = document.createElement('span');
                        tag.className = 'tag';
                        tag.style.background = 'rgba(0, 242, 254, 0.15)';
                        tag.style.borderColor = 'rgba(0, 242, 254, 0.4)';
                        tag.innerHTML = `
                            ${member}
                            <span class="tag-remove" onclick="removeMemberTag('${member}')">&times;</span>
                        `;
                        grpsWrapper.appendChild(tag);
                    });
                }
                
                // Render permissions
                if (g.permissions) {
                    g.permissions.forEach(perm => {
                        const tag = document.createElement('span');
                        tag.className = 'tag';
                        tag.innerHTML = `
                            ${perm}
                            <span class="tag-remove" onclick="removePermTag('${perm}')">&times;</span>
                        `;
                        permsWrapper.appendChild(tag);
                    });
                }
            } else if (currentEditor.type === 'user') {
                const u = state.users[currentEditor.id];

                // Render groups
                if (u.groups) {
                    u.groups.forEach(gName => {
                        const tag = document.createElement('span');
                        tag.className = 'tag';
                        tag.style.background = 'rgba(0, 242, 254, 0.15)';
                        tag.style.borderColor = 'rgba(0, 242, 254, 0.4)';
                        tag.innerHTML = `
                            ${gName}
                            <span class="tag-remove" onclick="removeGroupTag('${gName}')">&times;</span>
                        `;
                        grpsWrapper.appendChild(tag);
                    });
                }

                // Render permissions
                if (u.permissions) {
                    u.permissions.forEach(perm => {
                        const tag = document.createElement('span');
                        tag.className = 'tag';
                        tag.innerHTML = `
                            ${perm}
                            <span class="tag-remove" onclick="removePermTag('${perm}')">&times;</span>
                        `;
                        permsWrapper.appendChild(tag);
                    });
                }
            }
        }

        // Add/Remove Tags inside editor modal
        function removeGroupTag(name) {
            const u = state.users[currentEditor.id];
            u.groups = u.groups.filter(g => g !== name);
            // remove member from group state
            if (state.groups[name] && state.groups[name].members) {
                state.groups[name].members = state.groups[name].members.filter(m => m !== currentEditor.id);
            }
            refreshModalTags();
            renderLists();
        }

        function removeMemberTag(uuid) {
            const g = state.groups[currentEditor.id];
            g.members = g.members.filter(m => m !== uuid);
            // remove group from user state
            if (state.users[uuid] && state.users[uuid].groups) {
                state.users[uuid].groups = state.users[uuid].groups.filter(g => g !== currentEditor.id);
            }
            refreshModalTags();
            renderLists();
        }

        function removePermTag(perm) {
            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                g.permissions = g.permissions.filter(p => p !== perm);
            } else {
                const u = state.users[currentEditor.id];
                u.permissions = u.permissions.filter(p => p !== perm);
            }
            refreshModalTags();
            renderLists();
        }

        function addGroupTag() {
            const input = document.getElementById('group-add-input');
            const val = input.value.trim().toLowerCase();
            if (!val) return;

            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                if (!g.members) g.members = [];
                if (!g.members.includes(val)) {
                    g.members.push(val);
                    // Add group assignment to user profile if exists
                    if (!state.users[val]) state.users[val] = { permissions: [], groups: [] };
                    if (!state.users[val].groups) state.users[val].groups = [];
                    if (!state.users[val].groups.includes(currentEditor.id)) state.users[val].groups.push(currentEditor.id);
                }
            } else {
                const u = state.users[currentEditor.id];
                if (!u.groups) u.groups = [];
                if (!u.groups.includes(val)) {
                    u.groups.push(val);
                    // Add member to group profile if exists
                    if (!state.groups[val]) state.groups[val] = { permissions: [], members: [] };
                    if (!state.groups[val].members) state.groups[val].members = [];
                    if (!state.groups[val].members.includes(currentEditor.id)) state.groups[val].members.push(currentEditor.id);
                }
            }
            input.value = '';
            refreshModalTags();
            renderLists();
            document.getElementById('group-autocomplete').classList.remove('active');
        }

        function addPermTag() {
            const input = document.getElementById('perm-add-input');
            const val = input.value.trim().toLowerCase();
            if (!val) return;

            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                if (!g.permissions) g.permissions = [];
                if (!g.permissions.includes(val)) g.permissions.push(val);
            } else {
                const u = state.users[currentEditor.id];
                if (!u.permissions) u.permissions = [];
                if (!u.permissions.includes(val)) u.permissions.push(val);
            }
            input.value = '';
            refreshModalTags();
            renderLists();
            document.getElementById('perm-autocomplete').classList.remove('active');
        }

        // Autocomplete search handlers
        function handleGroupInput(el) {
            const dropdown = document.getElementById('group-autocomplete');
            const val = el.value.trim().toLowerCase();
            
            if (currentEditor.type === 'group') {
                dropdown.classList.remove('active');
                return; // User is typing a player UUID, no auto-complete
            }
            
            if (!val) {
                dropdown.classList.remove('active');
                return;
            }

            const matches = Object.keys(state.groups).filter(g => g.startsWith(val));
            if (matches.length === 0) {
                dropdown.classList.remove('active');
                return;
            }

            dropdown.innerHTML = '';
            matches.slice(0, 5).forEach(match => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerText = match;
                div.onclick = () => {
                    el.value = match;
                    addGroupTag();
                };
                dropdown.appendChild(div);
            });
            dropdown.classList.add('active');
        }

        function handlePermInput(el) {
            const dropdown = document.getElementById('perm-autocomplete');
            const val = el.value.trim().toLowerCase();

            if (!val) {
                dropdown.classList.remove('active');
                return;
            }

            const matches = state.registeredPermissions.filter(p => p.startsWith(val));
            if (matches.length === 0) {
                dropdown.classList.remove('active');
                return;
            }

            dropdown.innerHTML = '';
            matches.slice(0, 5).forEach(match => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerText = match;
                div.onclick = () => {
                    el.value = match;
                    addPermTag();
                };
                dropdown.appendChild(div);
            });
            dropdown.classList.add('active');
        }

        // New profile creations
        function openCreateGroupModal() {
            const name = prompt("Enter new group name:");
            if (!name) return;
            const normalized = name.trim().toLowerCase();
            if (state.groups[normalized]) {
                alert("Group already exists!");
                return;
            }
            state.groups[normalized] = { permissions: [], members: [] };
            renderLists();
            openGroupEditor(normalized);
        }

        function openCreatePlayerModal() {
            const uuid = prompt("Enter player UUID:");
            if (!uuid) return;
            const normalized = uuid.trim();
            if (state.users[normalized]) {
                alert("Player is already cached!");
                return;
            }
            state.users[normalized] = { permissions: [], groups: [] };
            renderLists();
            openUserEditor(normalized);
        }

        // Close autocompletes if clicking outside
        window.addEventListener('click', (e) => {
            if (!e.target.closest('.input-group')) {
                document.getElementById('group-autocomplete').classList.remove('active');
                document.getElementById('perm-autocomplete').classList.remove('active');
            }
        });

        // Register action triggers
        document.getElementById('search-groups').addEventListener('input', renderLists);
        document.getElementById('search-players').addEventListener('input', renderLists);
        document.getElementById('global-save-btn').addEventListener('click', saveState);

        // Load initial states
        loadState();
    </script>
</body>
</html>
