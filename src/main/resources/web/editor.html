<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoliaPerms Editor Panel</title>
    <!-- Google Fonts - Inter & Outfit for premium look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #09090b;
            --panel: #18181b;
            --border: #27272a;
            --border-hover: #3f3f46;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.1);
            --pill-bg: #27272a;
            --input-bg: #09090b;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-display: 'Outfit', var(--font-main);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Custom minimal scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        /* Header design */
        header {
            background-color: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .logo-symbol {
            width: 28px;
            height: 28px;
            background-color: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            font-family: var(--font-display);
        }

        .save-btn {
            background-color: var(--primary);
            border: 1px solid var(--primary);
            color: #ffffff;
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.15s ease;
        }

        .save-btn:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        /* Dashboard layout */
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 968px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* Panel design */
        .panel {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            height: 78vh;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .panel-title {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-counter {
            font-size: 0.75rem;
            background-color: var(--border);
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
        }

        .search-bar {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.65rem 0.9rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .search-bar:focus {
            border-color: var(--primary);
        }

        /* Item listing */
        .list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-right: 0.25rem;
        }

        .list-item {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.85rem 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .list-item:hover {
            border-color: var(--border-hover);
            background-color: rgba(255, 255, 255, 0.01);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            min-width: 0;
        }

        .item-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .meta-tag {
            background-color: rgba(255, 255, 255, 0.04);
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .item-actions {
            display: flex;
            gap: 0.25rem;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.45rem;
            border-radius: 6px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            color: var(--text);
            background-color: var(--border);
        }

        .action-btn.delete:hover {
            color: var(--danger);
            background-color: var(--danger-bg);
        }

        .create-btn {
            background-color: transparent;
            border: 1px dashed var(--border);
            color: var(--text-secondary);
            padding: 0.7rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.15s ease;
            margin-top: 1rem;
        }

        .create-btn:hover {
            border-color: var(--primary);
            color: var(--text);
            background-color: rgba(99, 102, 241, 0.05);
        }

        /* Modal Panel redesign */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 600px;
            max-width: 92%;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            transform: scale(0.96);
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.25rem;
            transition: color 0.15s ease;
            display: flex;
            align-items: center;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.75px;
        }

        /* Pill styling */
        .tags-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            min-height: 42px;
            padding: 0.6rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .tag {
            background-color: var(--pill-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tag-remove {
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: color 0.15s ease;
        }

        .tag-remove:hover {
            color: var(--danger);
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            position: relative;
        }

        .input-group input {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 0.85rem;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
            transition: border-color 0.15s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .add-tag-btn {
            background-color: var(--border);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 1.1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .add-tag-btn:hover {
            background-color: var(--border-hover);
            border-color: var(--border-hover);
        }

        /* Dropdowns */
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-top: 4px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .autocomplete-dropdown.active {
            display: block;
        }

        .autocomplete-item {
            padding: 0.55rem 0.85rem;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: all 0.15s ease;
        }

        .autocomplete-item:hover {
            background-color: var(--border);
            color: var(--text);
        }

        /* Modal footer */
        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
        }

        .cancel-btn {
            background-color: var(--border);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.55rem 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.15s ease;
        }

        .cancel-btn:hover {
            background-color: var(--border-hover);
            border-color: var(--border-hover);
        }

        /* Sleek clean toast notifications */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background-color: var(--panel);
            border: 1px solid var(--border);
            padding: 0.85rem 1.25rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transform: translateY(160%);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .toast.active {
            transform: translateY(0);
        }

        .toast-icon {
            font-weight: bold;
            font-size: 1rem;
        }

        .toast.success {
            border-color: var(--success);
            color: var(--success);
        }
        
        .toast.error {
            border-color: var(--danger);
            color: var(--danger);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-symbol">FP</div>
            FoliaPerms Editor
        </div>
        <button class="save-btn" id="global-save-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Save Changes
        </button>
    </header>

    <main>
        <!-- Groups Card -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">
                    Groups <span class="panel-counter" id="groups-count">0</span>
                </h2>
            </div>
            <input type="text" class="search-bar" id="search-groups" placeholder="Search groups...">
            <div class="list-container" id="groups-list">
                <!-- JS populated -->
            </div>
            <button class="create-btn" onclick="openCreateGroupModal()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Create Group
            </button>
        </div>

        <!-- Players Card -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">
                    Players <span class="panel-counter" id="players-count">0</span>
                </h2>
            </div>
            <input type="text" class="search-bar" id="search-players" placeholder="Search players...">
            <div class="list-container" id="players-list">
                <!-- JS populated -->
            </div>
            <button class="create-btn" onclick="openCreatePlayerModal()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Cache Player Profile
            </button>
        </div>
    </main>

    <!-- Overlay & Editor Dialog -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Edit Profile</h3>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <!-- Group Meta Settings (Prefix and Weight) - shown only for groups -->
                <div class="form-section" id="group-meta-section" style="display: none; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 0.25rem; flex-direction: row; gap: 1rem;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 0.4rem;">
                        <span class="form-label">Group Prefix</span>
                        <input type="text" id="group-prefix-input" class="search-bar" style="margin-bottom: 0;" placeholder="e.g. &c[Admin] " oninput="updateGroupMeta()">
                    </div>
                    <div style="width: 120px; display: flex; flex-direction: column; gap: 0.4rem;">
                        <span class="form-label">Weight</span>
                        <input type="number" id="group-weight-input" class="search-bar" style="margin-bottom: 0;" placeholder="0" oninput="updateGroupMeta()">
                    </div>
                </div>

                <!-- Group or UUID specific field -->
                <div class="form-section" id="groups-field-section">
                    <span class="form-label" id="modal-field-label">Assigned Groups</span>
                    <div class="tags-wrapper" id="modal-groups-tags">
                        <!-- Pill items -->
                    </div>
                    <div class="input-group">
                        <input type="text" id="group-add-input" placeholder="Type a group name..." oninput="handleGroupInput(this)">
                        <button class="add-tag-btn" onclick="addGroupTag()">Add</button>
                        <div class="autocomplete-dropdown" id="group-autocomplete"></div>
                    </div>
                </div>

                <!-- Permission Node Editor -->
                <div class="form-section">
                    <span class="form-label">Permission Nodes</span>
                    <div class="tags-wrapper" id="modal-perms-tags">
                        <!-- Pill items -->
                    </div>
                    <div class="input-group">
                        <input type="text" id="perm-add-input" placeholder="Type a permission node..." oninput="handlePermInput(this)">
                        <button class="add-tag-btn" onclick="addPermTag()">Add</button>
                        <div class="autocomplete-dropdown" id="perm-autocomplete"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Minimal custom toast -->
    <div class="toast" id="toast">
        <span class="toast-icon" id="toast-icon">✔</span>
        <span id="toast-msg">Settings saved successfully</span>
    </div>

    <script>
        // Reactive in-memory state
        let state = {
            users: {},
            groups: {},
            registeredPermissions: []
        };

        let currentEditor = {
            type: null, // 'user' or 'group'
            id: null    // UUID or Group key name
        };

        // Parse token from URL queries
        const token = new URLSearchParams(window.location.search).get('token') || '';

        // Toast visual feedback
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const label = document.getElementById('toast-msg');

            toast.className = 'toast ' + type;
            icon.innerText = type === 'success' ? '✔' : '✖';
            label.innerText = msg;

            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Fetch permissions state from embed API
        async function loadState() {
            try {
                const res = await fetch(`/api/data?token=${token}`);
                if (!res.ok) throw new Error(res.statusText);
                state = await res.json();
                renderLists();
            } catch (err) {
                console.error("Failed to fetch state:", err);
                showToast("Failed to connect to FoliaPerms server. Session may be expired.", "error");
            }
        }

        // POST synchronization to Minecraft server
        async function saveState() {
            try {
                const res = await fetch(`/api/save?token=${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        users: state.users,
                        groups: state.groups
                    })
                });
                
                if (res.ok) {
                    showToast("Successfully synchronized permission changes to server!", "success");
                } else {
                    const err = await res.json();
                    showToast(`Error: ${err.message || 'Failed to save changes.'}`, "error");
                }
            } catch (err) {
                console.error(err);
                showToast("Connection to server failed.", "error");
            }
        }

        // Render listings on the grid
        function renderLists() {
            // Render groups list
            const groupsContainer = document.getElementById('groups-list');
            const searchGroups = document.getElementById('search-groups').value.toLowerCase();
            groupsContainer.innerHTML = '';
            
            let gCount = 0;
            Object.keys(state.groups).forEach(name => {
                if (name.includes(searchGroups)) {
                    gCount++;
                    const g = state.groups[name];
                    const permsCount = g.permissions ? g.permissions.length : 0;
                    const membersCount = g.members ? g.members.length : 0;
                    
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.onclick = () => openGroupEditor(name);
                    div.innerHTML = `
                        <div class="item-info">
                            <span class="item-name">${name}</span>
                            <div class="item-meta">
                                <span class="meta-tag">${permsCount} permissions</span>
                                <span class="meta-tag">${membersCount} members</span>
                                ${g.prefix ? `<span class="meta-tag" style="font-family: monospace; font-size: 0.75rem;">"${g.prefix}"</span>` : ''}
                                ${g.weight ? `<span class="meta-tag">W: ${g.weight}</span>` : ''}
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn delete" onclick="deleteGroup('${name}', event)">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                    `;
                    groupsContainer.appendChild(div);
                }
            });
            document.getElementById('groups-count').innerText = gCount;

            // Render players list
            const playersContainer = document.getElementById('players-list');
            const searchPlayers = document.getElementById('search-players').value.toLowerCase();
            playersContainer.innerHTML = '';

            let pCount = 0;
            Object.keys(state.users).forEach(uuid => {
                if (uuid.includes(searchPlayers)) {
                    pCount++;
                    const u = state.users[uuid];
                    const permsCount = u.permissions ? u.permissions.length : 0;
                    const groupsCount = u.groups ? u.groups.length : 0;

                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.onclick = () => openUserEditor(uuid);
                    div.innerHTML = `
                        <div class="item-info">
                            <span class="item-name" style="font-family: monospace; font-size: 0.8rem; letter-spacing: -0.2px;">${uuid}</span>
                            <div class="item-meta">
                                <span class="meta-tag">${permsCount} permissions</span>
                                <span class="meta-tag">${groupsCount} groups</span>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn delete" onclick="deletePlayer('${uuid}', event)">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                    `;
                    playersContainer.appendChild(div);
                }
            });
            document.getElementById('players-count').innerText = pCount;
        }

        // Delete group record
        function deleteGroup(name, event) {
            event.stopPropagation();
            if (confirm(`Are you sure you want to delete group '${name}'?`)) {
                delete state.groups[name];
                // remove reference from users
                Object.values(state.users).forEach(u => {
                    if (u.groups) u.groups = u.groups.filter(g => g !== name);
                });
                renderLists();
            }
        }

        // Delete player record
        function deletePlayer(uuid, event) {
            event.stopPropagation();
            if (confirm(`Are you sure you want to delete player '${uuid}'?`)) {
                delete state.users[uuid];
                // remove reference from groups
                Object.values(state.groups).forEach(g => {
                    if (g.members) g.members = g.members.filter(m => m !== uuid);
                });
                renderLists();
            }
        }

        // Open specific modal editors
        function openGroupEditor(name) {
            currentEditor.type = 'group';
            currentEditor.id = name;
            
            document.getElementById('modal-title').innerText = `Group Settings: ${name}`;
            document.getElementById('groups-field-section').style.display = 'flex';
            document.getElementById('modal-field-label').innerText = 'Group Members (UUIDs)';
            document.getElementById('group-add-input').placeholder = 'Type player UUID to add...';
            
            const g = state.groups[name] || {};
            document.getElementById('group-meta-section').style.display = 'flex';
            document.getElementById('group-prefix-input').value = g.prefix || '';
            document.getElementById('group-weight-input').value = g.weight || 0;
            
            refreshModalTags();
            document.getElementById('modal-overlay').classList.add('active');
        }

        function openUserEditor(uuid) {
            currentEditor.type = 'user';
            currentEditor.id = uuid;

            document.getElementById('modal-title').innerText = `Player Settings: ${uuid}`;
            document.getElementById('groups-field-section').style.display = 'flex';
            document.getElementById('modal-field-label').innerText = 'Assigned Groups';
            document.getElementById('group-add-input').placeholder = 'Type group to assign...';

            document.getElementById('group-meta-section').style.display = 'none';

            refreshModalTags();
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            document.getElementById('group-autocomplete').classList.remove('active');
            document.getElementById('perm-autocomplete').classList.remove('active');
            document.getElementById('group-add-input').value = '';
            document.getElementById('perm-add-input').value = '';
        }

        function updateGroupMeta() {
            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                if (g) {
                    g.prefix = document.getElementById('group-prefix-input').value;
                    g.weight = parseInt(document.getElementById('group-weight-input').value) || 0;
                    renderLists();
                }
            }
        }

        // Render pills/badges in modals
        function refreshModalTags() {
            const grpsWrapper = document.getElementById('modal-groups-tags');
            const permsWrapper = document.getElementById('modal-perms-tags');
            grpsWrapper.innerHTML = '';
            permsWrapper.innerHTML = '';

            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                
                // Render members
                if (g.members) {
                    g.members.forEach(member => {
                        const tag = document.createElement('span');
                        tag.className = 'tag';
                        tag.innerHTML = `
                            ${member}
                            <span class="tag-remove" onclick="removeMemberTag('${member}')">&times;</span>
                        `;
                        grpsWrapper.appendChild(tag);
                    });
                }
                
                // Render permissions
                if (g.permissions) {
                    g.permissions.forEach(perm => {
                        const tag = document.createElement('span');
                        tag.className = 'tag';
                        tag.innerHTML = `
                            ${perm}
                            <span class="tag-remove" onclick="removePermTag('${perm}')">&times;</span>
                        `;
                        permsWrapper.appendChild(tag);
                    });
                }
            } else if (currentEditor.type === 'user') {
                const u = state.users[currentEditor.id];

                // Render groups
                if (u.groups) {
                    u.groups.forEach(gName => {
                        const tag = document.createElement('span');
                        tag.className = 'tag';
                        tag.innerHTML = `
                            ${gName}
                            <span class="tag-remove" onclick="removeGroupTag('${gName}')">&times;</span>
                        `;
                        grpsWrapper.appendChild(tag);
                    });
                }

                // Render permissions
                if (u.permissions) {
                    u.permissions.forEach(perm => {
                        const tag = document.createElement('span');
                        tag.className = 'tag';
                        tag.innerHTML = `
                            ${perm}
                            <span class="tag-remove" onclick="removePermTag('${perm}')">&times;</span>
                        `;
                        permsWrapper.appendChild(tag);
                    });
                }
            }
        }

        // Pills addition and removal modifications
        function removeGroupTag(name) {
            const u = state.users[currentEditor.id];
            u.groups = u.groups.filter(g => g !== name);
            if (state.groups[name] && state.groups[name].members) {
                state.groups[name].members = state.groups[name].members.filter(m => m !== currentEditor.id);
            }
            refreshModalTags();
            renderLists();
        }

        function removeMemberTag(uuid) {
            const g = state.groups[currentEditor.id];
            g.members = g.members.filter(m => m !== uuid);
            if (state.users[uuid] && state.users[uuid].groups) {
                state.users[uuid].groups = state.users[uuid].groups.filter(g => g !== currentEditor.id);
            }
            refreshModalTags();
            renderLists();
        }

        function removePermTag(perm) {
            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                g.permissions = g.permissions.filter(p => p !== perm);
            } else {
                const u = state.users[currentEditor.id];
                u.permissions = u.permissions.filter(p => p !== perm);
            }
            refreshModalTags();
            renderLists();
        }

        function addGroupTag() {
            const input = document.getElementById('group-add-input');
            const val = input.value.trim().toLowerCase();
            if (!val) return;

            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                if (!g.members) g.members = [];
                if (!g.members.includes(val)) {
                    g.members.push(val);
                    if (!state.users[val]) state.users[val] = { permissions: [], groups: [] };
                    if (!state.users[val].groups) state.users[val].groups = [];
                    if (!state.users[val].groups.includes(currentEditor.id)) state.users[val].groups.push(currentEditor.id);
                }
            } else {
                const u = state.users[currentEditor.id];
                if (!u.groups) u.groups = [];
                if (!u.groups.includes(val)) {
                    u.groups.push(val);
                    if (!state.groups[val]) state.groups[val] = { permissions: [], members: [] };
                    if (!state.groups[val].members) state.groups[val].members = [];
                    if (!state.groups[val].members.includes(currentEditor.id)) state.groups[val].members.push(currentEditor.id);
                }
            }
            input.value = '';
            refreshModalTags();
            renderLists();
            document.getElementById('group-autocomplete').classList.remove('active');
        }

        function addPermTag() {
            const input = document.getElementById('perm-add-input');
            const val = input.value.trim().toLowerCase();
            if (!val) return;

            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                if (!g.permissions) g.permissions = [];
                if (!g.permissions.includes(val)) g.permissions.push(val);
            } else {
                const u = state.users[currentEditor.id];
                if (!u.permissions) u.permissions = [];
                if (!u.permissions.includes(val)) u.permissions.push(val);
            }
            input.value = '';
            refreshModalTags();
            renderLists();
            document.getElementById('perm-autocomplete').classList.remove('active');
        }

        // Dropdown autocomplete lists
        function handleGroupInput(el) {
            const dropdown = document.getElementById('group-autocomplete');
            const val = el.value.trim().toLowerCase();
            
            if (currentEditor.type === 'group') {
                dropdown.classList.remove('active');
                return; // User is inputting a player UUID
            }
            
            if (!val) {
                dropdown.classList.remove('active');
                return;
            }

            const matches = Object.keys(state.groups).filter(g => g.startsWith(val));
            if (matches.length === 0) {
                dropdown.classList.remove('active');
                return;
            }

            dropdown.innerHTML = '';
            matches.slice(0, 5).forEach(match => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerText = match;
                div.onclick = () => {
                    el.value = match;
                    addGroupTag();
                };
                dropdown.appendChild(div);
            });
            dropdown.classList.add('active');
        }

        function handlePermInput(el) {
            const dropdown = document.getElementById('perm-autocomplete');
            const val = el.value.trim().toLowerCase();

            if (!val) {
                dropdown.classList.remove('active');
                return;
            }

            const matches = state.registeredPermissions.filter(p => p.startsWith(val));
            if (matches.length === 0) {
                dropdown.classList.remove('active');
                return;
            }

            dropdown.innerHTML = '';
            matches.slice(0, 5).forEach(match => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerText = match;
                div.onclick = () => {
                    el.value = match;
                    addPermTag();
                };
                dropdown.appendChild(div);
            });
            dropdown.classList.add('active');
        }

        // Dynamic element creation helpers
        function openCreateGroupModal() {
            const name = prompt("Enter new group name:");
            if (!name) return;
            const normalized = name.trim().toLowerCase();
            if (state.groups[normalized]) {
                alert("Group already exists!");
                return;
            }
            state.groups[normalized] = { permissions: [], members: [] };
            renderLists();
            openGroupEditor(normalized);
        }

        function openCreatePlayerModal() {
            const uuid = prompt("Enter player UUID:");
            if (!uuid) return;
            const normalized = uuid.trim();
            if (state.users[normalized]) {
                alert("Player profile is already cached!");
                return;
            }
            state.users[normalized] = { permissions: [], groups: [] };
            renderLists();
            openUserEditor(normalized);
        }

        // Autocomplete closing listener
        window.addEventListener('click', (e) => {
            if (!e.target.closest('.input-group')) {
                document.getElementById('group-autocomplete').classList.remove('active');
                document.getElementById('perm-autocomplete').classList.remove('active');
            }
        });

        // Event hooks
        document.getElementById('search-groups').addEventListener('input', renderLists);
        document.getElementById('search-players').addEventListener('input', renderLists);
        document.getElementById('global-save-btn').addEventListener('click', saveState);

        // Load initial states on mount
        loadState();
    </script>
</body>
</html>
