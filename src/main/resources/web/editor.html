<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoliaPerms Editor Panel</title>
    <!-- Google Fonts - Inter & Outfit for premium look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #09090b;
            --panel: #18181b;
            --border: #27272a;
            --border-hover: #3f3f46;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.1);
            --pill-bg: #27272a;
            --input-bg: #09090b;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-display: 'Outfit', var(--font-main);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Custom minimal scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        /* Header design */
        header {
            background-color: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .logo-symbol {
            width: 26px;
            height: 26px;
            background-color: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: var(--font-display);
        }

        .save-btn {
            background-color: var(--primary);
            border: 1px solid var(--primary);
            color: #ffffff;
            padding: 0.55rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.15s ease;
        }

        .save-btn:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        /* Main split view container */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
            height: calc(100vh - 56px);
        }

        /* Left Navigation Sidebar */
        .sidebar {
            width: 320px;
            background-color: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background-color: rgba(0, 0, 0, 0.15);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.85rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            position: relative;
        }

        .tab-btn:hover {
            color: var(--text-secondary);
        }

        .tab-btn.active {
            color: var(--text);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--primary);
        }

        .tab-content {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 1rem;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        .search-bar {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .search-bar:focus {
            border-color: var(--primary);
        }

        /* Sidebar listings */
        .list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding-right: 0.1rem;
        }

        .list-item {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.75rem 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .list-item:hover {
            border-color: var(--border-hover);
        }

        .list-item.active {
            border-color: var(--primary);
            background-color: rgba(99, 102, 241, 0.04);
        }

        .list-item.active .item-name {
            color: var(--primary);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            min-width: 0;
        }

        .item-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .meta-tag {
            background-color: rgba(255, 255, 255, 0.04);
            padding: 1px 5px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .item-actions {
            display: flex;
            gap: 0.25rem;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 6px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            color: var(--text);
            background-color: var(--border);
        }

        .action-btn.delete:hover {
            color: var(--danger);
            background-color: var(--danger-bg);
        }

        .create-btn {
            background-color: transparent;
            border: 1px dashed var(--border);
            color: var(--text-secondary);
            padding: 0.65rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.15s ease;
            margin-top: 1rem;
            flex-shrink: 0;
        }

        .create-btn:hover {
            border-color: var(--primary);
            color: var(--text);
            background-color: rgba(99, 102, 241, 0.04);
        }

        /* Right Content Panel */
        .main-content {
            flex: 1;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Placeholder Screen State */
        .placeholder-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            text-align: center;
        }

        .placeholder-icon {
            width: 56px;
            height: 56px;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }

        .placeholder-title {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.4rem;
        }

        .placeholder-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            max-width: 380px;
            line-height: 1.4;
        }

        /* Active inline editor panel */
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background-color: var(--panel);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex-shrink: 0;
        }

        .editor-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .editor-badge {
            font-size: 0.7rem;
            background-color: var(--primary);
            color: #ffffff;
            padding: 2px 7px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* Metadata form row (Prefix/Weight) */
        .meta-form-row {
            display: flex;
            gap: 1rem;
            background-color: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.85rem 1rem;
        }

        .meta-form-item {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .meta-form-item.flex-grow {
            flex: 1;
        }

        .meta-form-item.width-120 {
            width: 130px;
        }

        .form-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.75px;
        }

        /* Content cards view */
        .editor-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 1100px) {
            .editor-body {
                grid-template-columns: 1fr;
            }
        }

        .editor-card {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            height: fit-content;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.55rem;
            margin-bottom: 0.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-counter {
            font-size: 0.7rem;
            background-color: var(--border);
            color: var(--text-secondary);
            padding: 1px 7px;
            border-radius: 12px;
            font-weight: 500;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            position: relative;
        }

        .input-group input {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.55rem 0.8rem;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
            transition: border-color 0.15s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .add-tag-btn {
            background-color: var(--border);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.55rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .add-tag-btn:hover {
            background-color: var(--border-hover);
            border-color: var(--border-hover);
        }

        /* Permissions list table */
        .perms-table {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: var(--input-bg);
            overflow: hidden;
        }

        .perms-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.55rem 0.8rem;
            border-bottom: 1px solid var(--border);
        }

        .perms-row:last-child {
            border-bottom: none;
        }

        .perms-node {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            word-break: break-all;
            padding-right: 1rem;
        }

        .perms-row:hover {
            background-color: rgba(255, 255, 255, 0.01);
        }

        .delete-btn-sm {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .delete-btn-sm:hover {
            color: var(--danger);
            background-color: var(--danger-bg);
        }

        /* Pill badges card wrapping */
        .tags-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            min-height: 42px;
            padding: 0.55rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .tag {
            background-color: var(--pill-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tag-remove {
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: color 0.15s ease;
        }

        .tag-remove:hover {
            color: var(--danger);
        }

        /* Dropdowns */
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-top: 4px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .autocomplete-dropdown.active {
            display: block;
        }

        .autocomplete-item {
            padding: 0.55rem 0.85rem;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: all 0.15s ease;
        }

        .autocomplete-item:hover {
            background-color: var(--border);
            color: var(--text);
        }

        /* Sleek clean toast notifications */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background-color: var(--panel);
            border: 1px solid var(--border);
            padding: 0.85rem 1.25rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transform: translateY(160%);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .toast.active {
            transform: translateY(0);
        }

        .toast-icon {
            font-weight: bold;
            font-size: 1rem;
        }

        .toast.success {
            border-color: var(--success);
            color: var(--success);
        }
        
        .toast.error {
            border-color: var(--danger);
            color: var(--danger);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-symbol">FP</div>
            FoliaPerms Editor
        </div>
        <button class="save-btn" id="global-save-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Save Changes
        </button>
    </header>

    <div class="container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" id="tab-groups" onclick="switchTab('groups')">Groups</button>
                <button class="tab-btn" id="tab-players" onclick="switchTab('players')">Players</button>
            </div>
            
            <!-- Groups Tab Content -->
            <div class="tab-content active" id="content-groups">
                <input type="text" class="search-bar" id="search-groups" placeholder="Search groups...">
                <div class="list-container" id="groups-list">
                    <!-- Populated dynamically -->
                </div>
                <button class="create-btn" onclick="openCreateGroupModal()">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Create Group
                </button>
            </div>

            <!-- Players Tab Content -->
            <div class="tab-content" id="content-players">
                <input type="text" class="search-bar" id="search-players" placeholder="Search players...">
                <div class="list-container" id="players-list">
                    <!-- Populated dynamically -->
                </div>
                <button class="create-btn" onclick="openCreatePlayerModal()">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Cache Player Profile
                </button>
            </div>
        </div>

        <!-- Main Content Panel -->
        <div class="main-content">
            <!-- Placeholder Splash View -->
            <div class="placeholder-view" id="placeholder-screen">
                <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <h3 class="placeholder-title">FoliaPerms Editor Panel</h3>
                <p class="placeholder-subtitle">Select a group or player from the sidebar menu to begin inspecting and configuring permission settings.</p>
            </div>

            <!-- Active Inline Editor Panel -->
            <div class="editor-panel" id="active-editor-screen" style="display: none;">
                <div class="editor-header">
                    <div class="editor-header-top">
                        <div class="editor-title">
                            <span id="active-editor-title">Group Settings</span>
                            <span class="editor-badge" id="active-editor-badge">Group</span>
                        </div>
                    </div>
                    
                    <!-- Metadata configs inline for groups -->
                    <div class="meta-form-row" id="group-metadata-row" style="display: none;">
                        <div class="meta-form-item flex-grow">
                            <span class="form-label">Group Prefix</span>
                            <input type="text" id="group-prefix-input" class="search-bar" style="margin-bottom: 0;" placeholder="e.g. &c[Admin] " oninput="updateGroupMeta()">
                        </div>
                        <div class="meta-form-item width-120">
                            <span class="form-label">Weight</span>
                            <input type="number" id="group-weight-input" class="search-bar" style="margin-bottom: 0;" placeholder="0" oninput="updateGroupMeta()">
                        </div>
                    </div>
                </div>

                <div class="editor-body">
                    <!-- Left: Permission Nodes list -->
                    <div class="editor-card">
                        <div class="card-title">
                            <span>Permission Nodes</span>
                            <span class="panel-counter" id="active-perms-count">0</span>
                        </div>
                        
                        <div class="input-group">
                            <input type="text" id="perm-add-input" placeholder="Type a permission node to assign..." oninput="handlePermInput(this)">
                            <button class="add-tag-btn" onclick="addPermTag()">Add</button>
                            <div class="autocomplete-dropdown" id="perm-autocomplete"></div>
                        </div>

                        <div class="perms-table" id="active-perms-list">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <!-- Right: Group Members / Player Assigned Groups -->
                    <div class="editor-card" id="associations-card">
                        <div class="card-title">
                            <span id="associations-label">Assigned Groups</span>
                            <span class="panel-counter" id="active-associations-count">0</span>
                        </div>

                        <div class="input-group">
                            <input type="text" id="group-add-input" placeholder="Type a group to assign..." oninput="handleGroupInput(this)">
                            <button class="add-tag-btn" onclick="addGroupTag()">Add</button>
                            <div class="autocomplete-dropdown" id="group-autocomplete"></div>
                        </div>

                        <div class="tags-wrapper" id="active-associations-list">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast elements -->
    <div class="toast" id="toast">
        <span class="toast-icon" id="toast-icon">✔</span>
        <span id="toast-msg">Settings saved successfully</span>
    </div>

    <script>
        // Reactive in-memory state
        let state = {
            users: {},
            groups: {},
            registeredPermissions: []
        };

        let currentEditor = {
            type: null, // 'user' or 'group'
            id: null    // UUID or Group name
        };

        let activeTab = 'groups';

        // Parse token from URL queries
        const token = new URLSearchParams(window.location.search).get('token') || '';

        // Sidebar tab switching
        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tab-groups').classList.toggle('active', tab === 'groups');
            document.getElementById('tab-players').classList.toggle('active', tab === 'players');
            document.getElementById('content-groups').classList.toggle('active', tab === 'groups');
            document.getElementById('content-players').classList.toggle('active', tab === 'players');
        }

        // Toast visual feedback
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const label = document.getElementById('toast-msg');

            toast.className = 'toast ' + type;
            icon.innerText = type === 'success' ? '✔' : '✖';
            label.innerText = msg;

            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Fetch permissions state from embed API
        async function loadState() {
            try {
                const res = await fetch(`/api/data?token=${token}`);
                if (!res.ok) throw new Error(res.statusText);
                state = await res.json();
                renderLists();
            } catch (err) {
                console.error("Failed to fetch state:", err);
                showToast("Failed to connect to FoliaPerms server. Session may be expired.", "error");
            }
        }

        // POST synchronization to Minecraft server
        async function saveState() {
            try {
                const res = await fetch(`/api/save?token=${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        users: state.users,
                        groups: state.groups
                    })
                });
                
                if (res.ok) {
                    showToast("Successfully synchronized permission changes to server!", "success");
                } else {
                    const err = await res.json();
                    showToast(`Error: ${err.message || 'Failed to save changes.'}`, "error");
                }
            } catch (err) {
                console.error(err);
                showToast("Connection to server failed.", "error");
            }
        }

        // Render sidebar listings
        function renderLists() {
            // Render groups list
            const groupsContainer = document.getElementById('groups-list');
            const searchGroups = document.getElementById('search-groups').value.toLowerCase();
            groupsContainer.innerHTML = '';
            
            let gCount = 0;
            Object.keys(state.groups).forEach(name => {
                if (name.includes(searchGroups)) {
                    gCount++;
                    const g = state.groups[name];
                    const permsCount = g.permissions ? g.permissions.length : 0;
                    const membersCount = g.members ? g.members.length : 0;
                    
                    const activeClass = (currentEditor.type === 'group' && currentEditor.id === name) ? ' active' : '';
                    const div = document.createElement('div');
                    div.className = 'list-item' + activeClass;
                    div.onclick = () => openGroupEditor(name);
                    div.innerHTML = `
                        <div class="item-info">
                            <span class="item-name">${name}</span>
                            <div class="item-meta">
                                <span class="meta-tag">${permsCount} permissions</span>
                                <span class="meta-tag">${membersCount} members</span>
                                ${g.prefix ? `<span class="meta-tag" style="font-family: monospace; font-size: 0.7rem;">"${g.prefix}"</span>` : ''}
                                ${g.weight ? `<span class="meta-tag">W: ${g.weight}</span>` : ''}
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn delete" onclick="deleteGroup('${name}', event)">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                    `;
                    groupsContainer.appendChild(div);
                }
            });
            document.getElementById('groups-count').innerText = gCount;

            // Render players list
            const playersContainer = document.getElementById('players-list');
            const searchPlayers = document.getElementById('search-players').value.toLowerCase();
            playersContainer.innerHTML = '';

            let pCount = 0;
            Object.keys(state.users).forEach(uuid => {
                const u = state.users[uuid];
                const username = u.name || 'OfflinePlayer';
                if (uuid.includes(searchPlayers) || username.toLowerCase().includes(searchPlayers)) {
                    pCount++;
                    const permsCount = u.permissions ? u.permissions.length : 0;
                    const groupsCount = u.groups ? u.groups.length : 0;

                    const activeClass = (currentEditor.type === 'user' && currentEditor.id === uuid) ? ' active' : '';
                    const div = document.createElement('div');
                    div.className = 'list-item' + activeClass;
                    div.onclick = () => openUserEditor(uuid);
                    div.innerHTML = `
                        <div class="item-info">
                            <span class="item-name" style="font-weight: 600; font-size: 0.85rem; display: block; color: var(--text);">${username}</span>
                            <span class="item-sub" style="font-family: monospace; font-size: 0.65rem; color: var(--text-muted); display: block; margin-top: 1px; word-break: break-all;">${uuid}</span>
                            <div class="item-meta" style="margin-top: 4px;">
                                <span class="meta-tag">${permsCount} permissions</span>
                                <span class="meta-tag">${groupsCount} groups</span>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn delete" onclick="deletePlayer('${uuid}', event)">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                    `;
                    playersContainer.appendChild(div);
                }
            });
            document.getElementById('players-count').innerText = pCount;
        }

        // Delete group record
        function deleteGroup(name, event) {
            event.stopPropagation();
            if (confirm(`Are you sure you want to delete group '${name}'?`)) {
                delete state.groups[name];
                // remove reference from users
                Object.values(state.users).forEach(u => {
                    if (u.groups) u.groups = u.groups.filter(g => g !== name);
                });
                
                if (currentEditor.type === 'group' && currentEditor.id === name) {
                    currentEditor.type = null;
                    currentEditor.id = null;
                    document.getElementById('placeholder-screen').style.display = 'flex';
                    document.getElementById('active-editor-screen').style.display = 'none';
                }
                
                renderLists();
                refreshActiveEditor();
            }
        }

        // Delete player record
        function deletePlayer(uuid, event) {
            event.stopPropagation();
            if (confirm(`Are you sure you want to delete player '${uuid}'?`)) {
                delete state.users[uuid];
                // remove reference from groups
                Object.values(state.groups).forEach(g => {
                    if (g.members) g.members = g.members.filter(m => m !== uuid);
                });
                
                if (currentEditor.type === 'user' && currentEditor.id === uuid) {
                    currentEditor.type = null;
                    currentEditor.id = null;
                    document.getElementById('placeholder-screen').style.display = 'flex';
                    document.getElementById('active-editor-screen').style.display = 'none';
                }
                
                renderLists();
                refreshActiveEditor();
            }
        }

        // Open active inline editors
        function openGroupEditor(name) {
            currentEditor.type = 'group';
            currentEditor.id = name;
            
            switchTab('groups');
            
            document.getElementById('placeholder-screen').style.display = 'none';
            document.getElementById('active-editor-screen').style.display = 'flex';
            
            document.getElementById('active-editor-title').innerText = name;
            document.getElementById('active-editor-badge').innerText = 'Group';
            document.getElementById('active-editor-badge').style.backgroundColor = 'var(--primary)';
            
            const g = state.groups[name] || {};
            document.getElementById('group-metadata-row').style.display = 'flex';
            document.getElementById('group-prefix-input').value = g.prefix || '';
            document.getElementById('group-weight-input').value = g.weight || 0;
            
            document.getElementById('associations-label').innerText = 'Group Members (UUIDs)';
            document.getElementById('group-add-input').placeholder = 'Type player UUID to add...';
            
            refreshActiveEditor();
            renderLists();
        }

        function openUserEditor(uuid) {
            currentEditor.type = 'user';
            currentEditor.id = uuid;

            switchTab('players');

            document.getElementById('placeholder-screen').style.display = 'none';
            document.getElementById('active-editor-screen').style.display = 'flex';
            
            const u = state.users[uuid] || {};
            const username = u.name || 'OfflinePlayer';
            document.getElementById('active-editor-title').innerText = `${username} (${uuid})`;
            document.getElementById('active-editor-badge').innerText = 'Player';
            document.getElementById('active-editor-badge').style.backgroundColor = 'var(--success)';

            document.getElementById('group-metadata-row').style.display = 'none';

            document.getElementById('associations-label').innerText = 'Assigned Groups';
            document.getElementById('group-add-input').placeholder = 'Type group to assign...';

            refreshActiveEditor();
            renderLists();
        }

        function updateGroupMeta() {
            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                if (g) {
                    g.prefix = document.getElementById('group-prefix-input').value;
                    g.weight = parseInt(document.getElementById('group-weight-input').value) || 0;
                    renderLists();
                }
            }
        }

        // Render contents dynamically inside active inline panels
        function refreshActiveEditor() {
            const permsList = document.getElementById('active-perms-list');
            const assocList = document.getElementById('active-associations-list');
            permsList.innerHTML = '';
            assocList.innerHTML = '';
            
            if (!currentEditor.id) return;
            
            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                if (!g) return;
                
                // Permissions Nodes
                const perms = g.permissions || [];
                document.getElementById('active-perms-count').innerText = perms.length;
                if (perms.length === 0) {
                    permsList.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--text-muted); font-size: 0.85rem;">No permission nodes assigned.</div>';
                } else {
                    perms.forEach(perm => {
                        const row = document.createElement('div');
                        row.className = 'perms-row';
                        row.innerHTML = `
                            <span class="perms-node">${perm}</span>
                            <button class="delete-btn-sm" onclick="removePermTag('${perm}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        `;
                        permsList.appendChild(row);
                    });
                }
                
                // Group Members
                const members = g.members || [];
                document.getElementById('active-associations-count').innerText = members.length;
                members.forEach(member => {
                    const tag = document.createElement('span');
                    tag.className = 'tag';
                    const u = state.users[member] || {};
                    const displayName = u.name ? `${u.name} (${member.substring(0, 8)}...)` : member;
                    tag.innerHTML = `
                        <span style="font-family: monospace; font-size: 0.75rem;">${displayName}</span>
                        <span class="tag-remove" onclick="removeMemberTag('${member}')">&times;</span>
                    `;
                    assocList.appendChild(tag);
                });
            } else if (currentEditor.type === 'user') {
                const u = state.users[currentEditor.id];
                if (!u) return;
                
                // Permissions Nodes
                const perms = u.permissions || [];
                document.getElementById('active-perms-count').innerText = perms.length;
                if (perms.length === 0) {
                    permsList.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--text-muted); font-size: 0.85rem;">No permission nodes assigned.</div>';
                } else {
                    perms.forEach(perm => {
                        const row = document.createElement('div');
                        row.className = 'perms-row';
                        row.innerHTML = `
                            <span class="perms-node">${perm}</span>
                            <button class="delete-btn-sm" onclick="removePermTag('${perm}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        `;
                        permsList.appendChild(row);
                    });
                }
                
                // Assigned Groups
                const userGroups = u.groups || [];
                document.getElementById('active-associations-count').innerText = userGroups.length;
                userGroups.forEach(gName => {
                    const tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.innerHTML = `
                        <span>${gName}</span>
                        <span class="tag-remove" onclick="removeGroupTag('${gName}')">&times;</span>
                    `;
                    assocList.appendChild(tag);
                });
            }
        }

        // Tag addition and removal
        function removeGroupTag(name) {
            const u = state.users[currentEditor.id];
            u.groups = u.groups.filter(g => g !== name);
            if (state.groups[name] && state.groups[name].members) {
                state.groups[name].members = state.groups[name].members.filter(m => m !== currentEditor.id);
            }
            refreshActiveEditor();
            renderLists();
        }

        function removeMemberTag(uuid) {
            const g = state.groups[currentEditor.id];
            g.members = g.members.filter(m => m !== uuid);
            if (state.users[uuid] && state.users[uuid].groups) {
                state.users[uuid].groups = state.users[uuid].groups.filter(g => g !== currentEditor.id);
            }
            refreshActiveEditor();
            renderLists();
        }

        function removePermTag(perm) {
            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                g.permissions = g.permissions.filter(p => p !== perm);
            } else {
                const u = state.users[currentEditor.id];
                u.permissions = u.permissions.filter(p => p !== perm);
            }
            refreshActiveEditor();
            renderLists();
        }

        function addGroupTag() {
            const input = document.getElementById('group-add-input');
            const val = input.value.trim().toLowerCase();
            if (!val) return;

            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                if (!g.members) g.members = [];
                if (!g.members.includes(val)) {
                    g.members.push(val);
                    if (!state.users[val]) state.users[val] = { permissions: [], groups: [] };
                    if (!state.users[val].groups) state.users[val].groups = [];
                    if (!state.users[val].groups.includes(currentEditor.id)) state.users[val].groups.push(currentEditor.id);
                }
            } else {
                const u = state.users[currentEditor.id];
                if (!u.groups) u.groups = [];
                if (!u.groups.includes(val)) {
                    u.groups.push(val);
                    if (!state.groups[val]) state.groups[val] = { permissions: [], members: [] };
                    if (!state.groups[val].members) state.groups[val].members = [];
                    if (!state.groups[val].members.includes(currentEditor.id)) state.groups[val].members.push(currentEditor.id);
                }
            }
            input.value = '';
            refreshActiveEditor();
            renderLists();
            document.getElementById('group-autocomplete').classList.remove('active');
        }

        function addPermTag() {
            const input = document.getElementById('perm-add-input');
            const val = input.value.trim().toLowerCase();
            if (!val) return;

            if (currentEditor.type === 'group') {
                const g = state.groups[currentEditor.id];
                if (!g.permissions) g.permissions = [];
                if (!g.permissions.includes(val)) g.permissions.push(val);
            } else {
                const u = state.users[currentEditor.id];
                if (!u.permissions) u.permissions = [];
                if (!u.permissions.includes(val)) u.permissions.push(val);
            }
            input.value = '';
            refreshActiveEditor();
            renderLists();
            document.getElementById('perm-autocomplete').classList.remove('active');
        }

        // Dropdown autocomplete lists
        function handleGroupInput(el) {
            const dropdown = document.getElementById('group-autocomplete');
            const val = el.value.trim().toLowerCase();
            
            if (currentEditor.type === 'group') {
                dropdown.classList.remove('active');
                return; // User is inputting a player UUID
            }
            
            if (!val) {
                dropdown.classList.remove('active');
                return;
            }

            const matches = Object.keys(state.groups).filter(g => g.startsWith(val));
            if (matches.length === 0) {
                dropdown.classList.remove('active');
                return;
            }

            dropdown.innerHTML = '';
            matches.slice(0, 5).forEach(match => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerText = match;
                div.onclick = () => {
                    el.value = match;
                    addGroupTag();
                };
                dropdown.appendChild(div);
            });
            dropdown.classList.add('active');
        }

        function handlePermInput(el) {
            const dropdown = document.getElementById('perm-autocomplete');
            const val = el.value.trim().toLowerCase();

            if (!val) {
                dropdown.classList.remove('active');
                return;
            }

            const matches = state.registeredPermissions.filter(p => p.startsWith(val));
            if (matches.length === 0) {
                dropdown.classList.remove('active');
                return;
            }

            dropdown.innerHTML = '';
            matches.slice(0, 5).forEach(match => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerText = match;
                div.onclick = () => {
                    el.value = match;
                    addPermTag();
                };
                dropdown.appendChild(div);
            });
            dropdown.classList.add('active');
        }

        // Dynamic element creation helpers
        function openCreateGroupModal() {
            const name = prompt("Enter new group name:");
            if (!name) return;
            const normalized = name.trim().toLowerCase();
            if (state.groups[normalized]) {
                alert("Group already exists!");
                return;
            }
            state.groups[normalized] = { permissions: [], members: [] };
            renderLists();
            openGroupEditor(normalized);
        }

        function openCreatePlayerModal() {
            const uuid = prompt("Enter player UUID:");
            if (!uuid) return;
            const normalized = uuid.trim();
            if (state.users[normalized]) {
                alert("Player profile is already cached!");
                return;
            }
            state.users[normalized] = { permissions: [], groups: [] };
            renderLists();
            openUserEditor(normalized);
        }

        // Autocomplete closing listener
        window.addEventListener('click', (e) => {
            if (!e.target.closest('.input-group')) {
                document.getElementById('group-autocomplete').classList.remove('active');
                document.getElementById('perm-autocomplete').classList.remove('active');
            }
        });

        // Event hooks
        document.getElementById('search-groups').addEventListener('input', renderLists);
        document.getElementById('search-players').addEventListener('input', renderLists);
        document.getElementById('global-save-btn').addEventListener('click', saveState);

        // Load initial states on mount
        loadState();
    </script>
</body>
</html>
